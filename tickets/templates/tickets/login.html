{% extends 'tickets/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-6 col-lg-5 col-xl-4">
            <div class="card border-0 shadow-sm" style="border-radius: 12px;">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="bi bi-life-preserver" style="font-size: 2.5rem; color: #4F46E5;"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Welcome Back</h4>
                        <p class="text-muted small mb-0">Sign in to your HelpDesk account</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn w-100 mt-2 py-2 fw-semibold" style="background: #4F46E5; color: #fff; border-radius: 8px;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <small class="text-muted">
                            Don't have an account?
                            <a href="{% url 'register' %}" class="fw-semibold text-decoration-none" style="color: #4F46E5;">Register</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .card p { margin-bottom: 1.25rem; }
    .card label { font-weight: 500; font-size: 0.88rem; color: #374151; margin-bottom: 0.35rem; }
    .card input { border: 1px solid #D1D5DB; border-radius: 8px; padding: 0.6rem 0.85rem; font-size: 0.92rem; width: 100%; transition: border-color 0.15s; }
    .card input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    .helptext { display: block; font-size: 0.78rem; color: #6B7280; margin-top: 0.25rem; }
    .errorlist { list-style: none; padding: 0; margin: 0 0 0.5rem; font-size: 0.82rem; color: #DC2626; font-weight: 500; }
</style>
{% endblock %}
